[spec]
file = "basincity.spec"
title = "Basin City Surveillance"

[publish]
path = "/kattis/basincity"

[presentation]
subtitle = "Kernelisation and branching"
brand = "focus"
collapsible = ["Definitions"]

[implementation]
files = ["basincity_implem.v", "basincity.spec"]

[extraction]
languages = ["OCaml", "Rust", "Python", "Wasm", "C", "C++"]
