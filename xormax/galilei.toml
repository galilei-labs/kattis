[spec]
file = "xormax.spec"
title = "Xor Maximization"

[publish]
path = "/kattis/xormax"

[presentation]
subtitle = "Binary linear basis"
brand = "focus"
collapsible = ["Definitions"]

[implementation]
files = ["xormax_implem.v", "xormax.spec"]

[extraction]
languages = ["OCaml", "Rust", "Python", "Wasm", "C", "C++"]
extracted = ["OCaml", "Rust"]
files = ["extraction/ocaml/extract_marray.v", "extraction/ocaml/snapshots/xormax_extracted_marray.ml", "extraction/ocaml/snapshots/xormax_extracted_marray.mli", "extraction/ocaml/snapshots/marray.ml", "extraction/ocaml/submit/main.ml", "extraction/ocaml/submit/xormax.ml", "extraction/rust/extract.v", "extraction/rust/harness.rs", "extraction/rust/snapshots/xormax_extracted.rs", "extraction/rust/submit/xormax.rs"]
archive = "xormax_extractions.zip"

[extraction.interface]
OCaml = "extraction/ocaml/submit/xormax.ml"
Rust = "extraction/rust/snapshots/xormax_extracted.rs.interface.json"
