[spec]
file = "addemup.spec"
title = "Add 'Em Up!"

[publish]
path = "/kattis/addemup"

[presentation]
subtitle = "Sorting and binary search"
brand = "focus"
collapsible = ["Definitions"]

[implementation]
files = ["addemup_implem.v", "addemup.spec"]

[extraction]
languages = ["OCaml", "Rust", "Python", "Wasm", "C", "C++"]
extracted = ["OCaml", "Rust"]
files = ["extraction/ocaml/extract_marray.v", "extraction/ocaml/snapshots/addemup_extracted_marray.ml", "extraction/ocaml/snapshots/addemup_extracted_marray.mli", "extraction/ocaml/snapshots/marray.ml", "extraction/ocaml/submit/main.ml", "extraction/ocaml/submit/addemup.ml", "extraction/rust/extract.v", "extraction/rust/harness.rs", "extraction/rust/snapshots/addemup_extracted.rs", "extraction/rust/submit/addemup.rs"]
archive = "addemup_extractions.zip"

[extraction.interface]
OCaml = "extraction/ocaml/submit/addemup.ml"
Rust = "extraction/rust/submit/addemup.rs"
