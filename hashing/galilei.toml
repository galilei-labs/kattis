[spec]
file = "hashing.spec"
title = "String Hashing"

[publish]
path = "/kattis/hashing"

[presentation]
subtitle = "Polynomial prefix hashing"
brand = "focus"
collapsible = ["Definitions"]

[implementation]
files = ["hashing_implem.v", "hashing.spec"]

[extraction]
languages = ["OCaml", "Rust", "Python", "Wasm", "C", "C++"]
