files = ["extraction/ocaml/extract_marray.v", "extraction/ocaml/snapshots/hashing_extracted_marray.ml", "extraction/ocaml/snapshots/hashing_extracted_marray.mli", "extraction/ocaml/snapshots/marray.ml", "extraction/ocaml/submit/main.ml", "extraction/ocaml/submit/hashing.ml", "extraction/rust/extract.v", "extraction/rust/harness.rs", "extraction/rust/snapshots/hashing_extracted.rs", "extraction/rust/submit/hashing.rs"]
archive = "hashing_extractions.zip"

[extraction.interface]
OCaml = "extraction/ocaml/submit/hashing.ml"
Rust = "extraction/rust/snapshots/hashing_extracted.rs.interface.json"
