[spec]
file = "bst.spec"
title = "Binary search tree"

[publish]
path = "/kattis/bst"

[presentation]
subtitle = "Red-black tree neighbour queries"
brand = "focus"
collapsible = ["Definitions"]

[implementation]
files = ["bst_implem.v", "bst.spec"]

[extraction]
languages = ["OCaml", "Rust", "Python", "Wasm", "C", "C++"]
extracted = ["OCaml", "Rust"]
files = ["extraction/ocaml/extract_marray.v", "extraction/ocaml/snapshots/bst_extracted_marray.ml", "extraction/ocaml/snapshots/bst_extracted_marray.mli", "extraction/ocaml/snapshots/marray.ml", "extraction/ocaml/submit/main.ml", "extraction/ocaml/submit/bst.ml", "extraction/rust/extract.v", "extraction/rust/harness.rs", "extraction/rust/snapshots/bst_extracted.rs", "extraction/rust/submit/bst.rs"]
archive = "bst_extractions.zip"

[extraction.interface]
OCaml = "extraction/ocaml/submit/bst.ml"
Rust = "extraction/rust/snapshots/bst_extracted.rs.interface.json"
