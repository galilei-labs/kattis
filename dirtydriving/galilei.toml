[spec]
file = "dirtydriving.spec"
title = "Dirty Driving"

[publish]
path = "/kattis/dirtydriving"

[presentation]
subtitle = "Sorting and greedy scan"
brand = "focus"
collapsible = ["Definitions"]

[implementation]
files = ["dirtydriving_implem.v", "dirtydriving.spec"]

[extraction]
languages = ["OCaml", "Rust", "Python", "Wasm", "C", "C++"]
