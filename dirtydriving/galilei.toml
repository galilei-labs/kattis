files = ["extraction/ocaml/extract_marray.v", "extraction/ocaml/snapshots/dirtydriving_extracted_marray.ml", "extraction/ocaml/snapshots/dirtydriving_extracted_marray.mli", "extraction/ocaml/snapshots/marray.ml", "extraction/ocaml/submit/main.ml", "extraction/ocaml/submit/dirtydriving.ml", "extraction/rust/extract.v", "extraction/rust/harness.rs", "extraction/rust/snapshots/dirtydriving_extracted.rs", "extraction/rust/submit/dirtydriving.rs"]
archive = "dirtydriving_extractions.zip"

[extraction.interface]
OCaml = "extraction/ocaml/submit/dirtydriving.ml"
Rust = "extraction/rust/snapshots/dirtydriving_extracted.rs.interface.json"
