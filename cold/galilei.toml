# galilei.toml: page for cold.spec.
#   cd ../../focus && PORT=3001 uv run python scripts/serve.py ../kattis/cold

[spec]
file = "cold.spec"
title = "Cold-puter Science"

[publish]
path = "/kattis/cold"

[presentation]
subtitle = "Single-pass counting"
brand = "focus"
collapsible = ["Definitions"]

[implementation]
files = ["cold_implem.v", "cold.spec"]

[extraction]
languages = ["OCaml", "Rust", "Python", "Wasm", "C", "C++"]
extracted = ["OCaml", "Rust"]
files = ["extraction/ocaml/extract_marray.v", "extraction/ocaml/snapshots/cold_extracted_marray.ml", "extraction/ocaml/snapshots/cold_extracted_marray.mli", "extraction/ocaml/snapshots/marray.ml", "extraction/ocaml/submit/main.ml", "extraction/ocaml/submit/cold.ml", "extraction/rust/extract.v", "extraction/rust/harness.rs", "extraction/rust/snapshots/cold_extracted.rs", "extraction/rust/submit/cold.rs"]
archive = "cold_extractions.zip"

[extraction.interface]
OCaml = "extraction/ocaml/submit/cold.ml"
Rust = "extraction/rust/snapshots/cold_extracted.rs.interface.json"
