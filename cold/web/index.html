  };
  window.addEventListener('scroll', pageNavUpdate, { passive: true });
  nav.addEventListener('click', event => {
    const link = event.target.closest('a');
    if (!link) return;
    event.preventDefault();
    history.replaceState(null, '', link.hash);
    revealReference(link.hash);
    pageNavPinned = { section: document.getElementById(link.hash.slice(1)), y: scrollY };
    pageNavUpdate();
  });
  pageNavUpdate();
}

// In English panels, inline code naming a card ([count_negatives]) links to it.
function linkNames() {
  const ids = new Map([...document.querySelectorAll('#reader article.thm[id]')]
    .map(article => [article.dataset.name || article.querySelector('.nm')?.textContent, article.id]).filter(([name]) => name));
  document.querySelectorAll('#reader .fr p code, #reader .fr li code').forEach(code => {
    const id = ids.get(code.textContent);
    if (!id || code.closest('a') || code.closest('article')?.id === id) return;
    const link = document.createElement('a');
    link.className = 'name-link';
    link.href = '#' + id;
    code.replaceWith(link);
    link.append(code);
  });
}

// Each view hides the other side of the page.
function setView(view, enabled = true) {
  $('reader').classList.toggle('view-abstract', enabled && view === 'abstract');
  $('reader').classList.toggle('view-machine', enabled && view === 'machine');
  document.querySelectorAll('.view-toggle button').forEach(button =>
    button.setAttribute('aria-pressed', String(button.dataset.view === view)));
  pageNavUpdate?.();
}

// Show one tab of the page.
function selectTab(key) {
  document.querySelectorAll('.page-tabs [role="tab"]').forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.tab === key)));
  document.querySelectorAll('.tab-panel').forEach(panel => { panel.hidden = panel.id !== 'panel-' + key; });
  buildPageNav();
}

function revealReference(hash) {
  const target = document.getElementById(hash.slice(1));
  if (!target) return;
  const panel = target.closest('.tab-panel');
  if (panel?.hidden) selectTab(panel.id.slice('panel-'.length));
  if (target.closest('.machine-only') && $('reader').classList.contains('view-abstract')) setView('machine');
  if (target.closest('.abstract-only') && $('reader').classList.contains('view-machine')) setView('abstract');
  let details = target.closest('details');
  while (details) {
    details.open = true;
    details = details.parentElement.closest('details');
  }
  target.scrollIntoView({ block: 'start' });
}

$('reader').addEventListener('pointerover', event => {
  if (event.pointerType === 'touch') return;
  const link = event.target.closest('.code-reference');
  if (link && link !== previewLink) showPreview(link);
  else if (link) clearTimeout(closeTimer);
});
$('reader').addEventListener('pointerout', event => {
  const link = event.target.closest('.code-reference');
  if (link && !link.contains(event.relatedTarget) && !preview.contains(event.relatedTarget)) scheduleHide();
});
$('reader').addEventListener('focusin', event => {
  const link = event.target.closest('.code-reference');
  if (link) showPreview(link);
});
$('reader').addEventListener('focusout', event => {
  if (event.target === previewLink) scheduleHide();
});
$('reader').addEventListener('click', event => {
  const link = event.target.closest('.code-reference, .requirement-link, .name-link');
  if (link) {
    hidePreview();
    revealReference(link.hash);
  }
  if (event.target.closest('summary')) hidePreview();
  const languageButton = event.target.closest('[data-language]');
  if (languageButton) setInterfaceLanguage(languageButton.dataset.language);
  // Inline links that switch the types view or the tab.
  const gotoView = event.target.closest('[data-goto-view]');
  if (gotoView) {
    event.preventDefault();
    setView(gotoView.dataset.gotoView);
    document.getElementById('section-interface')?.scrollIntoView({ block: 'start' });
  }
  const gotoTab = event.target.closest('[data-goto-tab]');
  if (gotoTab) {
    event.preventDefault();
    selectTab(gotoTab.dataset.gotoTab);
    document.querySelector('.page-tabs')?.scrollIntoView({ block: 'start' });
  }
  const tab = event.target.closest('.page-tabs [role="tab"]');
  if (tab) selectTab(tab.dataset.tab);
  const fileLink = event.target.closest('.file-link');
  if (fileLink) showFile(Number(fileLink.closest('.file-explorer').dataset.explorer), Number(fileLink.dataset.file));
  const showButton = event.target.closest('.show-in-code');
  if (showButton) showLine(Number(showButton.dataset.explorer), Number(showButton.dataset.file), Number(showButton.dataset.line));
  const zip = event.target.closest('.download-zip');
  if (zip) saveBlob(zip.dataset.name, makeZip(explorers[Number(zip.dataset.explorer)]));
  const viewButton = event.target.closest('.view-toggle button');
  if (viewButton) setView(viewButton.dataset.view);
});
window.addEventListener('hashchange', () => revealReference(location.hash));
$('reader').addEventListener('change', event => {
  const select = event.target.closest('.model-select');
  if (!select) return;
  const note = select.parentElement.querySelector('.model-note');
  note.textContent = select.value ? 'No verified implementation by ' + select.value + ' yet.' : '';
});
preview.addEventListener('pointerenter', () => clearTimeout(closeTimer));
preview.addEventListener('pointerleave', scheduleHide);
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') hidePreview();
});
window.addEventListener('resize', hidePreview);
document.addEventListener('scroll', event => {
  if (!preview.contains(event.target)) hidePreview();
}, true);

const symbolTooltip = document.createElement('div');
symbolTooltip.id = 'symbol-tooltip';
symbolTooltip.className = 'symbol-tooltip';
symbolTooltip.setAttribute('role', 'tooltip');
symbolTooltip.hidden = true;
document.body.append(symbolTooltip);
let activeSymbol;
let symbolCloseTimer;
function hideSymbolTooltip() {
  clearTimeout(symbolCloseTimer);
  activeSymbol?.removeAttribute('aria-describedby');
  activeSymbol = null;
  symbolTooltip.hidden = true;
}
function showSymbolTooltip(symbol) {
  hideSymbolTooltip();
  activeSymbol = symbol;
  symbolTooltip.innerHTML = inlineProse(symbol.dataset.meaning);
  symbolTooltip.hidden = false;
  symbol.setAttribute('aria-describedby', symbolTooltip.id);
  const anchor = symbol.getBoundingClientRect();
  const box = symbolTooltip.getBoundingClientRect();
  symbolTooltip.style.left = Math.max(8, Math.min(anchor.left, innerWidth - box.width - 8)) + 'px';
  const above = symbol.dataset.placement !== 'below' && anchor.top >= box.height + 12;
  symbolTooltip.style.top = (above ? anchor.top - box.height - 8 : anchor.bottom + 8) + 'px';
}
document.addEventListener('pointerover', event => {
  const symbol = event.target.closest('.symbol-help');
  if (symbol) showSymbolTooltip(symbol);
  if (symbolTooltip.contains(event.target)) clearTimeout(symbolCloseTimer);
});
document.addEventListener('pointerout', event => {
  if (event.target.closest('.symbol-help') || symbolTooltip.contains(event.target))
    symbolCloseTimer = setTimeout(hideSymbolTooltip, 100);
});
document.addEventListener('focusin', event => {
  const symbol = event.target.closest('.symbol-help');
  if (symbol) showSymbolTooltip(symbol);
});
document.addEventListener('focusout', event => {
  if (event.target === activeSymbol) hideSymbolTooltip();
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') hideSymbolTooltip();
});
window.addEventListener('resize', hideSymbolTooltip);
document.addEventListener('scroll', hideSymbolTooltip, true);

loadExample();
</script>
